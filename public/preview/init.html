<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview Init</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #666;
    }
    .status {
      text-align: center;
    }
    .status.connected {
      color: #22c55e;
    }
    .status.error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div id="status" class="status">Initializing preview...</div>

  <script type="module">
    const statusEl = document.getElementById('status')

    function setStatus(text, type = '') {
      statusEl.textContent = text
      statusEl.className = 'status ' + type
    }

    if (!('serviceWorker' in navigator)) {
      setStatus('Service Worker not supported', 'error')
      throw new Error('Service Worker not supported')
    }

    try {
      await navigator.serviceWorker.ready
      console.log('[Preview Init] SW is ready')

      function checkReady() {
        if (navigator.serviceWorker.controller) {
          console.log('[Preview Init] SW is controlling, sending READY')
          setStatus('Service Worker ready, connecting...', 'connected')
          window.parent.postMessage({ type: 'SW_READY' }, '*')
        } else {
          console.log('[Preview Init] SW not yet controlling, waiting...')
          setTimeout(checkReady, 100)
        }
      }

      if (navigator.serviceWorker.controller) {
        checkReady()
      } else {
        navigator.serviceWorker.addEventListener('controllerchange', checkReady)
        setTimeout(() => {
          if (!navigator.serviceWorker.controller) {
            console.log('[Preview Init] SW still not controlling, reloading...')
            window.location.reload()
          }
        }, 2000)
      }
    } catch (error) {
      console.error('[Preview Init] SW setup failed:', error)
      setStatus('Failed: ' + error.message, 'error')
    }
  </script>
</body>
</html>
